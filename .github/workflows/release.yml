name: Release

# Stable tags and daily snapshots share the same packaging jobs.
# Pull requests touching packaging build preview artifacts without publishing.
on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release-metadata.py"
      - "scripts/test_release_metadata.py"
      - "scripts/release-downloads.py"
      - "scripts/test_release_downloads.py"
      - "scripts/bundle-macos.sh"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "nightly for the latest default branch, or an existing version tag such as v0.1.0"
        required: true
        default: nightly

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.ref_name || github.event.inputs.tag || 'nightly' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve source and channel
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      nightly: ${{ steps.v.outputs.nightly }}
      sha: ${{ steps.v.outputs.sha }}
      source_version: ${{ steps.v.outputs.source_version }}
      deb_version: ${{ steps.v.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release routing
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py' -v
      - name: Check out source to package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'nightly' && github.event.inputs.tag || github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
          path: source
      - id: v
        shell: bash
        working-directory: source
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 ../scripts/release-metadata.py --event "$RELEASE_EVENT" --tag "$REQUESTED_TAG" \
            --run-number "$GITHUB_RUN_NUMBER" --output "$GITHUB_OUTPUT"

  macos:
    name: macOS (universal)
    needs: meta
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test snapshot
        if: needs.meta.outputs.nightly == 'true'
        run: cargo test --locked
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/trunq \
            target/aarch64-apple-darwin/release/trunq \
            target/x86_64-apple-darwin/release/trunq
      - name: Bundle Trunq.app and .dmg
        env:
          TRUNQ_BINARY: target/universal/trunq
        run: ./scripts/bundle-macos.sh --dmg
      # Optional: sign & notarize when Apple credentials are configured as secrets
      # (APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #  APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD).
      - name: Sign & notarize
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          APP=target/release/bundle/Trunq.app
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          rm -f target/release/bundle/Trunq.dmg
          hdiutil create -volname Trunq -srcfolder "$APP" -ov -format UDZO target/release/bundle/Trunq.dmg
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp target/release/bundle/Trunq.dmg
          xcrun notarytool submit target/release/bundle/Trunq.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple target/release/bundle/Trunq.dmg
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/Trunq.dmg "dist/Trunq-${{ needs.meta.outputs.version }}-macos-universal.dmg"
          (cd target/release/bundle && zip -qry "../../../dist/Trunq-${{ needs.meta.outputs.version }}-macos-universal.app.zip" Trunq.app)
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.meta.outputs.nightly == 'true' && 7 || 90 }}

  linux:
    name: Linux (x86_64)
    needs: meta
    runs-on: ubuntu-22.04 # older glibc = runs on more distributions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev
      - name: Test snapshot
        if: needs.meta.outputs.nightly == 'true'
        run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package .tar.gz
        run: |
          NAME="trunq-${{ needs.meta.outputs.version }}-linux-x86_64"
          mkdir -p "dist/$NAME"
          cp target/release/trunq README.md LICENSE packaging/linux/trunq.desktop "dist/$NAME/"
          cp assets/app_icon.png "dist/$NAME/trunq.png"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
      - name: Package .deb
        env:
          NIGHTLY: ${{ needs.meta.outputs.nightly }}
          DEB_VERSION: ${{ needs.meta.outputs.deb_version }}
        run: |
          cargo install cargo-deb --locked
          if [ "$NIGHTLY" = true ]; then
            cargo deb --no-build --deb-version "$DEB_VERSION" --output "dist/trunq_${{ needs.meta.outputs.version }}_amd64.deb"
          else
            cargo deb --no-build --output "dist/trunq_${{ needs.meta.outputs.version }}_amd64.deb"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.meta.outputs.nightly == 'true' && 7 || 90 }}

  windows:
    name: Windows (x86_64)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test snapshot
        if: needs.meta.outputs.nightly == 'true'
        run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package .zip
        shell: pwsh
        run: |
          $name = "Trunq-${{ needs.meta.outputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/trunq.exe "dist/$name/Trunq.exe"
          Copy-Item target/release/trunq.exe "dist/$name.exe"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.meta.outputs.nightly == 'true' && 7 || 90 }}

  assemble:
    name: Assemble downloads and checksums
    needs: [meta, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 10
      - name: Load current release tooling (also when rebuilding an older tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify package set
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for package in \
            "Trunq-$VERSION-macos-universal.dmg" \
            "Trunq-$VERSION-macos-universal.app.zip" \
            "trunq-$VERSION-linux-x86_64.tar.gz" \
            "trunq_$VERSION"_amd64.deb \
            "Trunq-$VERSION-windows-x86_64.zip" \
            "Trunq-$VERSION-windows-x86_64.exe"; do
            test -s "dist/$package"
          done
      - name: Snapshot provenance
        if: needs.meta.outputs.nightly == 'true'
        env:
          SOURCE_SHA: ${{ needs.meta.outputs.sha }}
          SOURCE_VERSION: ${{ needs.meta.outputs.source_version }}
        run: |
          {
            echo "Channel: nightly"
            echo "Source commit: $SOURCE_SHA"
            echo "Cargo version: $SOURCE_VERSION"
            echo "Build workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            date -u '+Packaged at: %Y-%m-%d %H:%M:%S UTC'
          } > dist/BUILD_INFO.txt
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        if: needs.meta.outputs.nightly != 'true'
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $VERSION" > notes.md; fi
      - name: Nightly release notes
        if: needs.meta.outputs.nightly == 'true'
        env:
          SOURCE_SHA: ${{ needs.meta.outputs.sha }}
          SOURCE_VERSION: ${{ needs.meta.outputs.source_version }}
        run: |
          {
            echo "Daily development snapshot of the default branch. This is a prerelease, separate from the latest stable release."
            echo
            echo "Source commit: $SOURCE_SHA"
            echo "Cargo package version: $SOURCE_VERSION (the app may display this version; use BUILD_INFO.txt to identify the snapshot)."
            echo
            echo "All platform builds and snapshot unit tests completed before publication. Verify downloads with SHA256SUMS.txt."
            echo
            echo "Recent source changes:"
            git log -10 --format='- %h %s'
          } > notes.md
      - name: Direct platform download links
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 release-tools/scripts/release-downloads.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --output notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          if-no-files-found: error
          path: |
            dist/*
            notes.md
          retention-days: ${{ needs.meta.outputs.nightly == 'true' && 7 || 90 }}

  publish:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: [meta, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: .
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Trunq ${{ needs.meta.outputs.version }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          make_latest: ${{ needs.meta.outputs.nightly == 'true' && 'false' || 'legacy' }}
          body_path: notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: dist/*
