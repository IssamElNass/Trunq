name: Docker
on:
  pull_request:
    paths: ["src/**", "assets/**", "Cargo.*", "Dockerfile", ".dockerignore", "packaging/docker/**", "compose.yaml", ".github/workflows/docker.yml"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GitHub Container Registry
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: trunq:smoke
          cache-from: type=gha,scope=trunq-smoke
          cache-to: type=gha,scope=trunq-smoke,mode=max,ignore-error=true,timeout=5m
      - name: Start desktop and verify client stays alive
        run: |
          docker run -d --name trunq-smoke -p 127.0.0.1:8080:8080 --shm-size=256m trunq:smoke
          trap 'docker logs trunq-smoke; docker rm -f trunq-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/vnc.html > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/vnc.html > /dev/null
          sleep 10
          test "$(docker inspect -f '{{.State.Running}}' trunq-smoke)" = true
          docker exec trunq-smoke sh -c 'test -n "$(pgrep -x trunq)"'
  publish:
    needs: smoke
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=trunq-publish
            type=gha,scope=trunq-smoke
          cache-to: type=gha,scope=trunq-publish,mode=max,ignore-error=true,timeout=5m
      - name: Show published tags and pull commands
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '### Published container image'
            echo
            echo '```sh'
            while IFS= read -r tag; do
              printf 'docker pull %s\n' "$tag"
            done <<< "$TAGS"
            echo '```'
            printf '\nDigest: `%s`\n' "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
